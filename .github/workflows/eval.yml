name: eval

on:
  push:
  pull_request:

env:
  FAITH_GATE: "0.60"         # override to tighten as the corpus improves

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify GROQ_API_KEY secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY is empty or not set in GitHub secrets"
            exit 1
          else
            echo "✅ GROQ_API_KEY is set (length: ${#GROQ_API_KEY})"
          fi

      - name: Check corpus availability
        run: |
          if [ -f data/index/faiss.index ] && [ -f data/index/bm25.pkl ] && [ -f data/index/chunks.jsonl ]; then
            echo "HAS_INDEX=true" >> $GITHUB_ENV
            echo "✅ Index found — full benchmark will run."
          else
            echo "HAS_INDEX=false" >> $GITHUB_ENV
            echo "⚠️  No index found — running smoke test only."
          fi

      - name: Smoke test (no index)
        if: env.HAS_INDEX == 'false'
        run: |
          echo "--- Verifying imports and query file ---"
          python -c "
          import app.main, app.router, app.router_v2
          import app.tiers.hybrid, app.tiers.long_context, app.tiers.graph_rag, app.tiers.agentic
          import eval.benchmark, eval.metrics, eval.crossover
          import json, pathlib
          queries = [json.loads(l) for l in pathlib.Path('eval/queries.ci.jsonl').read_text().splitlines() if l.strip()]
          assert len(queries) == 10, f'Expected 10 CI queries, got {len(queries)}'
          print(f'✅ All imports OK. {len(queries)} CI queries validated.')
          "

      - name: Run benchmark + faithfulness regression gate
        if: env.HAS_INDEX == 'true'
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FAITH_GATE: ${{ env.FAITH_GATE }}
        run: |
          python -m eval.benchmark \
            --queries eval/queries.ci.jsonl \
            --save-results eval/results.json
        # exit(1) from benchmark.py if faithfulness gate fails → job fails

      - name: Crossover analysis
        if: env.HAS_INDEX == 'true' && success()
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m eval.crossover --results eval/results.json

      - name: Upload results artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: eval/results.json
          if-no-files-found: ignore
